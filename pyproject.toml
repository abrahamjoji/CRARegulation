[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cra-evidence"
description = "CI-integrated dependency evidence, vulnerability analysis and CRA readiness tooling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abraham Joji" }]
requires-python = ">=3.11"
dynamic = ["version"]
# The collector, local engine and gate deliberately have no runtime dependencies.
dependencies = []

[project.optional-dependencies]
hosted = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["jsonschema>=4.23,<5", "httpx>=0.27,<1"]

[project.scripts]
cra = "cra.cli:entrypoint"
cra-server = "cra.hosted.admin:entrypoint"

[tool.setuptools.dynamic]
version = { attr = "cra.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cra = ["schemas/*.json", "data/*.json", "data/templates/*.json"]
