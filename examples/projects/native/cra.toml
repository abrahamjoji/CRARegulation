# Copy into a C or C++ customer's project root. The language does not change this config.
# Run cra prepare before configuring CMake, then collect after the build.
schema_version = "cra.config/1"
[product]
name = "native-app"
version = "1.0.0"
[scope]
roots = ["."]
[output]
dir = ".cra"
[[configurations]]
id = "release"
cmake_build_dir = "build"
# Optional: add conan_graph = "conan-graph.json" when Conan is used.
# For multi-configuration generators, add cmake_config = "Release".
[[artifacts]]
id = "app"
path = "build/app"
configuration = "release"
shipped = true
