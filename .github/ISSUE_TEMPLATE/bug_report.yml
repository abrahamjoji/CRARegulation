name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the Security tab instead (see SECURITY.md).
        Remove any secrets, tokens or customer data from logs before pasting them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, configuration and inputs needed to reproduce the problem.
      placeholder: |
        1. cra init ...
        2. cra analyze ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main at abc1234
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Debian 12, x86-64, Python 3.12, Docker 27
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
