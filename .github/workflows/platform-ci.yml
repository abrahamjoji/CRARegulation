name: Platform tests
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  routine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Install locked test dependencies
        run: pip install --require-hashes -r requirements/dev.lock
      - name: Deterministic tests (fake scanners, no network)
        run: python -m unittest discover tests
  real-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.12"}
      - name: Install locked dependencies and pinned tools
        run: |
          pip install --require-hashes -r requirements/dev.lock
          # Conan needs its own runtime dependencies; the dev lock contains API/test dependencies only.
          pip install conan==2.34.0 cmake==4.4.4 ninja==1.13.2
          scripts/install_tools.sh
          .tools/grype db update
      - name: Real Conan, CMake, Syft, Grype and cosign
        env:
          CRA_INTEGRATION: "1"
        run: python -m unittest discover -s tests/integration -t tests
