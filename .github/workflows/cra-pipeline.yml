name: CRA proof-of-concept pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Run the strict release gate on this candidate (does not publish)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Replace the demo inventory with the SBOM from your built product.
  PRODUCT_NAME: DEMO-200
  FIRMWARE_DIR: firmware
  PRODUCT_FILE: product.json
  MANUAL_SBOM: sbom/manual-components.cdx.json
  VEX_FILE: vex/demo200.openvex.json
  RISK_FILE: risk/risk-assessment.json
  REGISTER_FILE: vuln/register.json
  DEMO_DATE: "2026-11-05"

jobs:
  # Tests the scripts, then builds the labelled demo report from the curated sample data.
  demo:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: poc/legacy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test the pipeline scripts
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover tests

      - name: Build the demo report from sample data
        run: |
          python scripts/cra_report.py \
            --product product.json \
            --sbom sample-data/sbom.syft.cdx.json \
            --manual sbom/manual-components.cdx.json \
            --scan sample-data/scan.grype.json \
            --vex vex/demo200.openvex.json \
            --risk risk/risk-assessment.json \
            --register vuln/register.json \
            --kev sample-data/kev.json \
            --out demo/cra-report.html \
            --summary demo/cra-summary.json \
            --sample --date "$DEMO_DATE" --gate

      - name: Keep the demo report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cra-demo-report-${{ github.sha }}
          path: poc/legacy/demo/
          retention-days: 90

  cra:
    needs: demo
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: poc/legacy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Clear checked-in demo output
        run: |
          rm -rf -- out
          mkdir -p out

      # Digests retrieved from the official release asset APIs, 2026-11-06.
      # Review version + digest together. Never fetch a mutable install.sh.
      - name: Install pinned Syft and Grype binaries
        run: |
          mkdir -p "$RUNNER_TEMP/cra-tools" out
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 180 https://github.com/anchore/syft/releases/download/v1.57.0/syft_1.57.0_linux_amd64.tar.gz -o "$RUNNER_TEMP/syft.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 180 https://github.com/anchore/grype/releases/download/v0.121.2/grype_0.121.2_linux_amd64.tar.gz -o "$RUNNER_TEMP/grype.tar.gz"
          echo "9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c --strict
          echo "9c8965ced9df657e5e851c14021bae838802f711edd7a48f9bc3c923a8d28f12  $RUNNER_TEMP/grype.tar.gz" | sha256sum -c --strict
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/cra-tools" syft
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/cra-tools" grype
          echo "$RUNNER_TEMP/cra-tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cra-tools/syft" version > out/syft-version.txt
          "$RUNNER_TEMP/cra-tools/grype" version > out/grype-version.txt

      # Match the manual SBOM schema; Syft's unversioned output follows its latest schema.
      - name: Generate SBOM from the firmware sources
        run: syft scan "dir:$FIRMWARE_DIR" -o cyclonedx-json@1.5=out/sbom.cdx.json

      - name: Add manual components
        run: python scripts/merge_sbom.py out/sbom.cdx.json "$MANUAL_SBOM" -o out/sbom.full.cdx.json

      - name: Match components against known vulnerabilities
        run: |
          grype sbom:out/sbom.full.cdx.json --add-cpes-if-none -o json > out/scan.grype.json
          grype db status > out/grype-db.txt

      - name: Fetch the CISA Known Exploited Vulnerabilities catalogue
        run: curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --max-time 120 https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o out/kev.json

      - name: Build report and check candidate before publication
        env:
          RELEASE_CANDIDATE: ${{ inputs.release_candidate }}
        run: |
          GATE=--gate
          if [ "$RELEASE_CANDIDATE" = true ]; then GATE=--release-gate; fi
          python scripts/cra_report.py \
            --product "$PRODUCT_FILE" --sbom out/sbom.full.cdx.json \
            --scan out/scan.grype.json --vex "$VEX_FILE" \
            --risk "$RISK_FILE" --register "$REGISTER_FILE" --kev out/kev.json \
            --out out/cra-report.html --summary out/cra-summary.json "$GATE"

      - name: Snapshot inputs, linked evidence and tool provenance
        if: ${{ !cancelled() && hashFiles('poc/legacy/out/cra-summary.json') != '' }}
        run: |
          python scripts/cra_evidence.py --product "$PRODUCT_FILE" \
            --out out/evidence --revision "$GITHUB_SHA" \
            out/sbom.cdx.json out/sbom.full.cdx.json "$MANUAL_SBOM" \
            out/scan.grype.json out/kev.json "$VEX_FILE" "$RISK_FILE" "$REGISTER_FILE" \
            out/syft-version.txt out/grype-version.txt out/grype-db.txt \
            out/cra-report.html out/cra-summary.json

      - name: Retain technical evidence as a CI artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cra-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: poc/legacy/out/
          retention-days: 90
          if-no-files-found: error

      - name: Prepare SBOM for isolated monitoring upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monitoring-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: poc/legacy/out/sbom.full.cdx.json
          retention-days: 1
          if-no-files-found: error

  # A fresh runner: scanner code never shares a machine with these credentials.
  monitoring-upload:
    needs: cra
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: monitoring-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: sbom
      - name: Upload SBOM to Dependency-Track
        env:
          DT_URL: ${{ secrets.DT_URL }}
          DT_API_KEY: ${{ secrets.DT_API_KEY }}
        run: |
          if [ -z "$DT_URL" ] || [ -z "$DT_API_KEY" ]; then exit 0; fi
          case "$DT_URL" in https://*) ;; *) echo "DT_URL must use HTTPS" >&2; exit 1 ;; esac
          curl --proto '=https' --tlsv1.2 --max-time 120 -fsS -X POST "$DT_URL/api/v1/bom" \
            -H "X-Api-Key: $DT_API_KEY" \
            --form-string 'autoCreate=true' \
            --form-string "projectName=$PRODUCT_NAME" \
            --form-string "projectVersion=$GITHUB_SHA" \
            -F 'bom=@sbom/sbom.full.cdx.json'
